<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #1d1d1f;
    background: radial-gradient(circle at 870px 315px, #f4f1ea 0, #ebe6db 300px, #e3dccd 301px, #f6f3ec 302px);
  }
  .text { position: absolute; left: 80px; top: 150px; width: 520px; }
  .eyebrow { font-size: 30px; font-weight: 700; color: #5b4bdb; }
  h1 { font-size: 92px; letter-spacing: -3px; line-height: 1.05; margin-top: 14px; }
  p { font-size: 32px; color: #6f6a62; margin-top: 22px; line-height: 1.4; }
  .arena { position: absolute; left: 570px; top: 15px; width: 600px; height: 600px; }
  .leader { position: absolute; left: 255px; top: 240px; font-size: 92px; }
  .shield { position: absolute; left: 160px; top: 150px; width: 300px; height: 300px; border-radius: 50%;
    border: 22px solid transparent; border-top-color: #4a3cc9; border-left-color: #4a3cc9; transform: rotate(-20deg); }
  .b { position: absolute; padding: 10px 20px; border-radius: 999px; font-size: 26px; font-weight: 800; border: 3px solid; white-space: nowrap; }
  .who { position: absolute; font-size: 64px; }
</style>
</head>
<body>
  <div class="text">
    <div class="eyebrow">🛡️ 45세 팀장, 정년까지 15년</div>
    <h1>버텨라,<br/>팀장님</h1>
    <p>팀원 불만, 지각, 고객 컴플레인,<br/>상사 지시, 희망퇴직 압박까지<br/>방패 하나로 막아내기</p>
  </div>
  <div class="arena">
    <div class="shield"></div>
    <div class="leader">🧑‍💼</div>
    <div class="who" style="left:40px;top:40px">🤵</div>
    <div class="who" style="left:470px;top:60px">🧓</div>
    <div class="who" style="left:20px;top:420px">🧑‍💻</div>
    <div class="who" style="left:480px;top:440px">👩‍💼</div>
    <div class="b" style="left:110px;top:110px;background:#d6ecff;color:#0b4a85">📋 주말에 잠깐만</div>
    <div class="b" style="left:330px;top:150px;background:#3a3a44;color:#fff;border-color:#3a3a44">📉 희망퇴직 면담</div>
    <div class="b" style="left:60px;top:350px;background:#ffe1b8;color:#7a3d00">😤 이걸 왜 제가요?</div>
    <div class="b" style="left:330px;top:390px;background:#fff3a8;color:#6b5600">⏰ 5분만요!</div>
    <div class="b" style="left:200px;top:500px;background:#ffd0d0;color:#8a1010">☎️ 책임자 나와!</div>
  </div>
</body>
</html>
