<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:'Jua',sans-serif;color:#3b2a1e;background:#fff6e5;position:relative;
background-image:linear-gradient(45deg,rgba(255,122,69,.08) 25%,transparent 25%,transparent 75%,rgba(255,122,69,.08) 75%),linear-gradient(45deg,rgba(255,122,69,.08) 25%,transparent 25%,transparent 75%,rgba(255,122,69,.08) 75%);background-size:60px 60px;background-position:0 0,30px 30px}
.l{position:absolute;left:80px;top:96px;width:620px}
h1{font-size:118px;margin:0;font-weight:400;letter-spacing:-2px}
p{font-size:42px;margin:18px 0 0;line-height:1.35}
p b{color:#ff7a45;font-weight:400}
.money{display:inline-block;margin-top:34px;background:#2f9e5b;color:#fff;font-size:44px;padding:12px 30px;border-radius:99px;box-shadow:0 10px 24px rgba(0,0,0,.15)}
.box{position:absolute;right:80px;top:80px;width:420px;height:470px;background:#fff;border-radius:40px;box-shadow:0 24px 60px rgba(80,40,10,.18);padding:26px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.2fr 1fr;gap:16px;transform:rotate(4deg)}
.box div{border-radius:22px;display:grid;place-items:center;font-size:96px}
.a{grid-column:1/3;background:#ffe2c8}.b{background:#e3f6ea}.c{background:#fff0b8}
</style></head><body>
<div class="l"><h1>싸왔어? 🍱</h1><p>오늘 도시락 자랑하고<br><b>아낀 점심값</b>까지 쌓기</p><div class="money">💰 이번 달 17만원 아낌</div></div>
<div class="box"><div class="a">🍙🍳🥦</div><div class="b">🥗</div><div class="c">🍤</div></div>
</body></html>
