<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: 'Gowun Dodum', sans-serif; color: #1b1f2a; background: linear-gradient(135deg, #fff4ef 0%, #ffe1da 55%, #ffd0c6 100%); }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 90px; gap: 80px; }
  .radar { position: relative; width: 340px; height: 340px; flex: none; display: grid; place-items: center; }
  .ring { position: absolute; border-radius: 50%; border: 4px solid rgba(255,107,87,.35); }
  .phone { position: relative; font-size: 150px; filter: drop-shadow(0 16px 30px rgba(255,107,87,.35)); transform: rotate(-10deg); }
  .wave { position: absolute; right: 30px; top: 40px; font-size: 60px; }
  .chip { display: inline-block; padding: 10px 22px; border-radius: 999px; background: #fff; color: #ff6b57; font-size: 26px; font-family: 'Jua', sans-serif; margin-bottom: 22px; box-shadow: 0 6px 20px rgba(255,107,87,.15); }
  h1 { font-family: 'Jua', sans-serif; font-weight: 400; font-size: 112px; line-height: 1; letter-spacing: -2px; }
  h1 em { font-style: normal; color: #ff6b57; }
  .tag { margin-top: 26px; font-size: 34px; color: #4a4f5e; }
  .pills { margin-top: 30px; display: flex; gap: 14px; }
  .pill { height: 58px; padding: 0 24px; display: flex; align-items: center; border-radius: 999px; background: #fff; font-family: 'Jua', sans-serif; font-size: 28px; box-shadow: 0 6px 0 #ffc4b8; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="radar">
      <div class="ring" style="width:340px;height:340px"></div>
      <div class="ring" style="width:250px;height:250px;border-color:rgba(255,107,87,.5)"></div>
      <div class="ring" style="width:160px;height:160px;border-color:rgba(255,107,87,.7)"></div>
      <div class="phone">📱</div>
      <div class="wave">🔔</div>
    </div>
    <div>
      <div class="chip">가족 폰 찾기</div>
      <h1>우리집 <em>폰</em><br/>어디 갔지?</h1>
      <p class="tag">가족 폰까지 거리 · 지도 위치 · 소리 울리기</p>
      <div class="pills"><div class="pill">📍 49m</div><div class="pill">🗺️ 지도</div><div class="pill">🔔 여기야!</div></div>
    </div>
  </div>
</body>
</html>
