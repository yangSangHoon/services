<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 48px; padding: 0 64px 0 84px;
    font-family: 'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #1b1d26;
    background: radial-gradient(90% 120% at 80% 50%, #f6f4ff, #e6e8f1);
  }
  .left { flex: 1; }
  .logo { font-size: 30px; font-weight: 800; margin-bottom: 24px; color: #6c4cf1; }
  h1 { font-size: 78px; line-height: 1.12; letter-spacing: -3px; font-weight: 900; }
  h1 em { font-style: normal; color: #6c4cf1; }
  .sub { margin-top: 24px; font-size: 28px; color: #7a7f8e; font-weight: 600; }
  .board { flex: none; display: grid; grid-template-columns: repeat(6, 68px); gap: 8px; padding: 18px; border-radius: 28px; background: #fff; box-shadow: 0 24px 50px rgba(60, 40, 140, 0.2); }
  .board i { width: 68px; height: 68px; border-radius: 14px; background: #e4e6ee; display: grid; place-items: center; font-style: normal; font-size: 36px; }
</style>
</head>
<body>
  <div class="left">
    <div class="logo">🦄 스타트업 M&amp;A</div>
    <h1>창업, 투자,<br /><em>인수합병!</em></h1>
    <p class="sub">2~6인 · 친구·봇과 온라인 보드게임</p>
  </div>
  <div class="board" id="b"></div>
  <script>
    const C = ['#f08c2e', '#e8559a', '#2fae5f', '#14a7c4', '#3d6be0', '#8a5ad8', '#e0483e'];
    const E = ['🛵', '🐾', '💪', '✈️', '💳', '🤖', '🧠'];
    const map = [
      6, 6, -2, -1, 5, 5,
      6, -2, -2, 2, 2, 5,
      6, 6, -2, 2, -2, 5,
      -1, -2, 4, 4, -2, -2,
      0, -2, 4, -2, 1, 1,
      0, 0, -2, -1, -2, 1,
    ];
    const seen = new Set();
    document.getElementById('b').innerHTML = map.map((v) => {
      if (v === -2) return '<i></i>';
      if (v === -1) return '<i style="background:#5d6273"></i>';
      const first = !seen.has(v); seen.add(v);
      return `<i style="background:${C[v]}">${first ? E[v] : ''}</i>`;
    }).join('');
  </script>
</body>
</html>
