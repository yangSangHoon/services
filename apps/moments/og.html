<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#fbf6ee;font-family:'Gowun Dodum',sans-serif;color:#2b2622;position:relative}
.left{position:absolute;left:80px;top:120px;width:560px}
.brand{font-family:'Gowun Batang';font-weight:700;font-size:96px;line-height:1;letter-spacing:-2px}
.brand span{font-size:64px;vertical-align:middle}
h1{font-size:46px;margin:22px 0 14px;line-height:1.3;font-weight:400}
h1 b{color:#f0694e}
p{font-size:26px;color:#6f655c;margin:0}
.chips{display:flex;gap:10px;margin-top:34px;font-size:34px}
.chips span{background:#fffdf8;border:2px solid #ece3d6;border-radius:18px;padding:6px 12px}
.pol{position:absolute;background:#fffdf8;border-radius:8px;box-shadow:0 18px 40px rgba(60,40,20,.18);padding:16px 16px 0;box-sizing:border-box}
.pol .ph{border-radius:3px}
.pol .t{font-family:'Gowun Batang';font-size:26px;padding:12px 4px;line-height:1.3}
.p1{width:330px;right:300px;top:60px;transform:rotate(-7deg)}
.p1 .ph{height:240px;background:linear-gradient(160deg,#ffd76a,#ffb3c1)}
.p2{width:300px;right:60px;top:220px;transform:rotate(6deg)}
.p2 .ph{height:200px;background:linear-gradient(160deg,#9fd8f5,#c9b8ff)}
.ph{display:grid;place-items:center;font-size:90px}
</style></head><body>
<div class="left">
  <div class="brand"><span>📸</span> 찰나</div>
  <h1>웃음 터진 그 순간,<br><b>10초 만에</b> 남겨두기</h1>
  <p>사진 한 장, 한 줄이면 충분해요</p>
  <div class="chips"><span>😂</span><span>🥰</span><span>🥹</span><span>🙏</span><span>😢</span></div>
</div>
<div class="pol p1"><div class="ph">😂</div><div class="t">리모컨이 냉장고에 😂</div></div>
<div class="pol p2"><div class="ph">🥹</div><div class="t">처음 "아빠" 한 날</div></div>
</body></html>
