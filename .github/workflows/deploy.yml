name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # publishable key는 브라우저 번들에 들어가는 공개용 키라 그대로 둔다 (RLS로 보호)
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://sugayrefionpkzkzdgss.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_Iotik3ovp8kvKTjyofrInA_BfYDTT3d
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
