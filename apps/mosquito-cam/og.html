<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 56px; padding: 0 84px;
    font-family: 'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #f4f2ee;
    background: radial-gradient(90% 120% at 80% 50%, #1d2244, #0d1020);
  }
  .left { flex: 1; }
  .logo { font-size: 30px; font-weight: 800; margin-bottom: 26px; color: #ffd34d; }
  h1 { font-size: 80px; line-height: 1.12; letter-spacing: -3px; font-weight: 800; }
  .sub { margin-top: 26px; font-size: 28px; color: #9ea3bd; }
  .phone {
    position: relative; width: 300px; height: 520px; border-radius: 44px; border: 10px solid #2a2f52; overflow: hidden;
    background: linear-gradient(160deg, #3a3f63, #1b1f3a);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .rec { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(0,0,0,.5); font-size: 20px; font-weight: 700; }
  .rec i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #ff3b3b; margin-right: 8px; }
  .zzz { position: absolute; left: 40px; top: 210px; font-size: 120px; }
  .m1 { position: absolute; right: 30px; top: 150px; font-size: 64px; transform: rotate(-20deg); }
  .buzz { position: absolute; right: 14px; top: 100px; font-size: 30px; font-weight: 800; color: #ffd34d; transform: rotate(-8deg); }
  .btn { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); width: 76px; height: 76px; border-radius: 50%; border: 5px solid #fff; display: grid; place-items: center; }
  .btn span { width: 30px; height: 30px; border-radius: 8px; background: #ff3b3b; }
</style>
</head>
<body>
  <div class="left">
    <div class="logo">🦟 앵앵 몰카</div>
    <h1>자는 사람 귓가에<br />모기 소리를 🎥</h1>
    <p class="sub">화면엔 모기가 날고, 스피커에선 앵~</p>
  </div>
  <div class="phone">
    <div class="rec"><i></i>0:07</div>
    <div class="buzz">앵~~</div>
    <div class="m1">🦟</div>
    <div class="zzz">😴</div>
    <div class="btn"><span></span></div>
  </div>
</body>
</html>
