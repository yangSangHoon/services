<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 40px; padding: 0 70px 0 84px;
    font-family: 'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', sans-serif; color: #22201c;
    background: radial-gradient(90% 120% at 80% 50%, #faf6ee, #e9e3d6);
  }
  .left { flex: 1; }
  .logo { font-size: 30px; font-weight: 800; margin-bottom: 24px; color: #2f5d50; }
  h1 { font-size: 80px; line-height: 1.1; letter-spacing: -3px; font-weight: 900; }
  h1 em { font-style: normal; color: #e0453f; }
  .sub { margin-top: 24px; font-size: 29px; color: #827b70; font-weight: 600; }
  .felt { width: 470px; padding: 44px 34px 52px; border-radius: 40px; background: #2f5d50; box-shadow: inset 0 4px 20px rgba(0,0,0,.35), 0 24px 50px rgba(30,50,40,.3); display: flex; flex-direction: column; gap: 34px; }
  .row { display: flex; gap: 14px; justify-content: center; }
  .t { width: 70px; height: 100px; border-radius: 13px; display: grid; place-items: center; font-size: 46px; font-weight: 900; }
  .b { background: linear-gradient(160deg, #3a3d45, #24262c); color: #f6f3ea; box-shadow: 0 6px 0 #0e0f12, 0 10px 18px rgba(0,0,0,.3); }
  .w { background: linear-gradient(160deg, #fff, #faf8f2); color: #22201c; box-shadow: 0 6px 0 #c9c2b2, 0 10px 18px rgba(0,0,0,.2); }
  .bb { background: repeating-linear-gradient(135deg, #24262c, #24262c 9px, #30333a 9px, #30333a 18px); box-shadow: 0 6px 0 #0e0f12, 0 10px 18px rgba(0,0,0,.3); }
  .wb { background: repeating-linear-gradient(135deg, #faf8f2, #faf8f2 9px, #ebe8e0 9px, #ebe8e0 18px); box-shadow: 0 6px 0 #c9c2b2, 0 10px 18px rgba(0,0,0,.2); }
  .q { position: relative; outline: 5px solid #f2b322; outline-offset: 5px; }
  .q::after { content: '?'; position: absolute; top: -70px; left: 50%; transform: translateX(-50%); width: 56px; height: 56px; border-radius: 50%; background: #f2b322; color: #22201c; display: grid; place-items: center; font-size: 36px; }
</style>
</head>
<body>
  <div class="left">
    <div class="logo">🔢 다빈치 코드</div>
    <h1>숨은 숫자를<br /><em>추리해 맞혀라!</em></h1>
    <p class="sub">친구·봇과 2~4인 온라인 대결</p>
  </div>
  <div class="felt">
    <div class="row"><span class="t bb"></span><span class="t w">3</span><span class="t wb q"></span><span class="t bb"></span><span class="t w">9</span></div>
    <div class="row"><span class="t b">1</span><span class="t w">4</span><span class="t b">6</span><span class="t w">8</span><span class="t b">11</span></div>
  </div>
</body>
</html>
