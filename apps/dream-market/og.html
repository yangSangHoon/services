<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: 'Gowun Dodum', sans-serif; color: #3a2f63;
    background: linear-gradient(180deg, #a99bf5 0%, #d3b3f1 36%, #f8c4dc 68%, #ffe3cc 100%);
  }
  .star { position: absolute; background: #fff; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  .dot { position: absolute; background: #fff; border-radius: 50%; opacity: .8; }
  .cloud { position: absolute; border-radius: 999px; background: rgba(255,255,255,.55); filter: blur(8px); }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 90px; gap: 70px; }
  .moon { position: relative; width: 260px; height: 260px; flex: none; transform: rotate(-18deg); }
  .moon::before { content: ''; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset -58px 10px 0 0 #fff4c2; filter: drop-shadow(0 0 40px rgba(255,244,194,.95)); }
  .moon::after { content: ''; position: absolute; right: 30px; top: 108px; width: 14px; height: 14px; border-radius: 50%; background: #ffb6cf; }
  .chip { display: inline-block; padding: 10px 20px; border-radius: 999px; background: rgba(255,255,255,.32); border: 2px solid rgba(255,255,255,.7); color: #fff; font-size: 24px; margin-bottom: 22px; }
  h1 { font-family: 'Jua', sans-serif; font-weight: 400; font-size: 132px; line-height: 1; color: #fff; letter-spacing: -2px; text-shadow: 0 7px 0 rgba(111,91,214,.35), 0 18px 50px rgba(111,91,214,.35); }
  .tag { margin-top: 26px; font-size: 36px; }
  .sub { margin-top: 10px; font-size: 26px; color: #6a6192; }
  .pills { margin-top: 30px; display: flex; gap: 12px; }
  .pill { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 26px 0 12px; border-radius: 999px; font-family: 'Jua', sans-serif; font-size: 28px; background: #ffe596; box-shadow: 0 7px 0 #f0c53f; }
  .pill.mint { background: #bdeedb; box-shadow: 0 7px 0 #8fd9bd; padding-left: 26px; }
  .coin { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #fff7cf, #ffe596 45%, #f0c53f); font-size: 20px; color: #a57a00; }
</style>
</head>
<body>
  <div class="cloud" style="left:-80px;bottom:60px;width:420px;height:120px"></div>
  <div class="cloud" style="right:-60px;bottom:20px;width:360px;height:100px"></div>
  <i class="star" style="left:80px;top:60px;width:22px;height:22px"></i>
  <i class="star" style="left:430px;top:90px;width:14px;height:14px"></i>
  <i class="star" style="left:1040px;top:70px;width:26px;height:26px"></i>
  <i class="star" style="left:1120px;top:250px;width:14px;height:14px"></i>
  <i class="star" style="left:360px;top:500px;width:16px;height:16px"></i>
  <i class="dot" style="left:220px;top:130px;width:6px;height:6px"></i>
  <i class="dot" style="left:700px;top:50px;width:6px;height:6px"></i>
  <i class="dot" style="left:900px;top:130px;width:5px;height:5px"></i>
  <i class="dot" style="left:160px;top:420px;width:6px;height:6px"></i>
  <div class="wrap">
    <div class="moon"></div>
    <div>
      <span class="chip">✦ 오늘 밤 장 열림</span>
      <h1>꿈사꿈팔</h1>
      <p class="tag">남의 꿈을 사고, 내 꿈을 파는 시장</p>
      <p class="sub">진짜 꿨는지는 아무도 몰라요 🤫</p>
      <div class="pills">
        <span class="pill"><span class="coin">꿈</span>가입하면 1억 코인</span>
        <span class="pill mint">🎁 무료 나눔도 OK</span>
      </div>
    </div>
  </div>
</body>
</html>
